<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Versión maskable: el sistema puede recortar el ícono en círculo o en
       cuadrado redondeado, así que el fondo llega a los bordes y el símbolo
       queda dentro del 80% central (la "zona segura"). -->
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="50%" y="50%" dy="0.34em" text-anchor="middle"
        font-family="Inter, Segoe UI, system-ui, sans-serif"
        font-size="230" font-weight="800" fill="#ffffff">$</text>
</svg>
